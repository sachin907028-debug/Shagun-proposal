<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shagun, ek sawaal hai 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 22px; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffe2ee, #f6e8ff 55%, #fff0d9);
    color: #60364f;
  }
  .card {
    width: min(520px, 100%); text-align: center; padding: 34px 22px;
    border: 1px solid #ffffffb8; border-radius: 28px;
    background: #ffffffd9; box-shadow: 0 18px 55px #a64c7b24;
    position: relative; z-index: 1;
  }
  .heart { font-size: 48px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { transform: scale(1.14); } }
  h1 { font-size: clamp(27px, 7vw, 38px); margin: 12px 0; }
  p { font-size: 17px; line-height: 1.55; }
  .buttons { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; margin:26px 0 12px; min-height:58px; }
  button {
    border:0; border-radius:999px; padding:14px 25px; font-size:17px;
    font-weight:700; cursor:pointer; box-shadow:0 7px 18px #8c4d6a24;
  }
  #yes { background:#ec5b98; color:white; }
  #no { background:#f0eaf0; color:#684b60; position:relative; }
  #message { min-height:52px; font-weight:650; color:#b23e79; }
  .small { font-size:13px; color:#8a7181; margin-top:18px; }
  .honest { font-size:14px; margin-top:10px; }
  .honest button { background:transparent; box-shadow:none; padding:6px 8px; color:#8a7181; font-size:13px; text-decoration:underline; }
  .float { position:fixed; opacity:.55; pointer-events:none; animation: drift 7s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translateY(-24px) rotate(18deg); } }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="float" style="top:9%;left:9%;font-size:28px">💗</div>
<div class="float" style="top:17%;right:10%;font-size:24px;animation-delay:1s">✨</div>
<div class="float" style="bottom:12%;left:13%;font-size:26px;animation-delay:2s">🌸</div>
<div class="float" style="bottom:10%;right:12%;font-size:30px;animation-delay:.5s">💕</div>

<main class="card">
  <div class="heart">💌</div>
  <h1>Shagun, ek sawaal hai...</h1>
  <p>Mujhe tumse kuch kehna tha.<br>Toh socha thoda filmy aur funny tareeke se pooch loon 😄</p>
  <h2>Kya tum mujhe pasand karti ho? 💗</h2>
  <div class="buttons">
    <button id="yes">Haan! ❤️</button>
    <button id="no">Nahi 🙈</button>
  </div>
  <div id="message" aria-live="polite"></div>
  <div class="honest">
    <button id="honestNo" type="button">Agar nahi, toh honestly bata sakti ho 💛</button>
  </div>
  <div class="small">Made with a little courage and lots of butterflies 🦋</div>
</main>
<script>
const no = document.getElementById('no');
const yes = document.getElementById('yes');
const message = document.getElementById('message');
let escapes = 0;

function dodge() {
  if (escapes < 5) {
    const maxX = Math.max(0, window.innerWidth - no.offsetWidth - 24);
    const maxY = Math.max(0, window.innerHeight - no.offsetHeight - 24);
    no.style.position = 'fixed';
    no.style.left = (12 + Math.random() * maxX) + 'px';
    no.style.top = (12 + Math.random() * maxY) + 'px';
    escapes++;
    message.textContent = ['Arre! Pakad ke dikhao 😂','Oops, NO toh bhaag gaya! 🙈','Button ko bhi sharam aa rahi hai 😅','Ek aur try? 😂','Theek hai, ab sach mein choice tumhari 💛'][escapes-1];
  } else {
    no.style.position = 'relative';
    no.style.left = 'auto'; no.style.top = 'auto';
    message.textContent = 'Ab NO bhi yahin hai — jo dil kahe woh choose karna. 💛';
  }
}
no.addEventListener('pointerenter', dodge);
no.addEventListener('click', () => {
  message.textContent = 'Koi baat nahi, Shagun. Sach batane ke liye thank you. 💛';
});
yes.addEventListener('click', () => {
  document.querySelector('.card').innerHTML = `
    <div class="heart">🥳💗</div>
    <h1>CONGRATULATIONS, SHAGUN! 🎉</h1>
    <h2>Ab se tum meri girlfriend hui! 💞</h2>
    <p>Officially meri favourite notification ban gayi ho 😄</p>
    <p>Ab hamesha haste rehna, aur apni cute si smile kabhi mat khona! 🌸</p>
    <div style="font-size:34px;margin:18px">💖 🦋 💖</div>
    <p style="font-weight:700">— Tumhara (hopefully) favourite person 😉</p>
    <p class="small">P.S. Ye ek cute beginning hai. Respect, honesty aur smiles always! 💛</p>
  `;
  for (let i=0; i<36; i++) {
    const s=document.createElement('span');
    s.textContent=['💖','✨','💕','🌸','🎉'][i%5];
    s.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:${Math.random()*100}vh;font-size:${18+Math.random()*22}px;pointer-events:none;animation:fade 2.5s forwards;z-index:5`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),2500);
  }
});
document.getElementById('honestNo').addEventListener('click', () => {
  message.textContent = 'Bilkul honestly batana — tumhara jawab jo bhi ho, respect rahegi. 💛';
});
</script>
<style>@keyframes fade { to { transform:translateY(-45px) rotate(25deg); opacity:0; } }</style>
</body>
</html>
